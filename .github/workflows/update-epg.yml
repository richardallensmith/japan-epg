name: Update XMLTV EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Run tests
        run: python -m unittest discover -v
      - name: Build and validate feed
        env:
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
        run: python -m src.main
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp output/epg.xml _site/epg.xml
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: ${{ vars.ENABLE_PAGES_PUBLISH == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy only after explicit repository opt-in
        id: deployment
        uses: actions/deploy-pages@v4
