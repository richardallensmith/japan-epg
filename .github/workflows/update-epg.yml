name: Update XMLTV EPG

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Restore persistent translation cache
        uses: actions/cache/restore@v4
        with:
          path: cache/translations.json
          key: translations-${{ runner.os }}-${{ hashFiles('cache/translations.json') }}-${{ github.run_id }}
          restore-keys: |
            translations-${{ runner.os }}-${{ hashFiles('cache/translations.json') }}-
      - name: Run tests
        run: python -m unittest discover -v
      - name: Build and validate fresh EPG
        id: epg-build
        continue-on-error: true
        env:
          # Optional contact field only when deliberately configured by the owner.
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
        run: python -m src.main --days 2 --output output/epg.next.xml
      - name: Promote fresh EPG
        if: steps.epg-build.outcome == 'success'
        run: mv output/epg.next.xml output/epg.xml
      - name: Keep last known-good EPG after transient build failure
        if: steps.epg-build.outcome != 'success'
        run: |
          rm -f output/epg.next.xml
          echo "::warning::Fresh EPG build failed; publishing the last committed epg.xml with current playlist-health artifacts."
      - name: Save persistent translation cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/translations.json
          key: translations-${{ runner.os }}-${{ hashFiles('cache/translations.json') }}-${{ github.run_id }}
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp output/epg.xml _site/epg.xml
          cp output/japan-live.m3u _site/japan-live.m3u
          cp output/stream-health.md _site/stream-health.md
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: ${{ vars.ENABLE_PAGES_PUBLISH == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy only after explicit repository opt-in
        id: deployment
        uses: actions/deploy-pages@v4
